<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <style>
      .favicon-globe { stroke: #1B365D; fill: none; stroke-width: 2; }
      .favicon-gear { stroke: #1B365D; fill: none; stroke-width: 2; }
      .favicon-accent { fill: #00D4AA; }
    </style>
  </defs>
  
  <!-- Background (optional, remove for transparency) -->
  <rect width="64" height="64" fill="none"/>
  
  <!-- Globe with Gear Icon -->
  <g transform="translate(32, 32)">
    <!-- Globe circle -->
    <circle cx="0" cy="0" r="16" class="favicon-globe"/>
    
    <!-- Globe grid lines -->
    <line x1="-16" y1="0" x2="16" y2="0" class="favicon-globe"/>
    <line x1="0" y1="-16" x2="0" y2="16" class="favicon-globe"/>
    <path d="M -12,-8 Q 0,-10 12,-8" class="favicon-globe"/>
    <path d="M -12,8 Q 0,10 12,8" class="favicon-globe"/>
    
    <!-- Gear teeth (cross pattern) -->
    <line x1="0" y1="-24" x2="0" y2="-28" class="favicon-gear"/>
    <line x1="0" y1="24" x2="0" y2="28" class="favicon-gear"/>
    <line x1="24" y1="0" x2="28" y2="0" class="favicon-gear"/>
    <line x1="-24" y1="0" x2="-28" y2="0" class="favicon-gear"/>
  </g>
  
  <!-- Green Accent Dot (top right) -->
  <circle cx="48" cy="16" r="6" class="favicon-accent"/>
</svg>