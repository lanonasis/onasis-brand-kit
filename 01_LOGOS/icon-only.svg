<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- L Character -->
  <text x="12" y="100" font-family="Georgia, serif" font-size="90" font-weight="bold" fill="#1B365D">L</text>
  
  <!-- Vertical Separator Line -->
  <line x1="68" y1="8" x2="68" y2="110" stroke="#1B365D" stroke-width="3"/>
  
  <!-- Globe Icon -->
  <g transform="translate(95, 55)">
    <!-- Globe circle -->
    <circle cx="0" cy="0" r="14" stroke="#1B365D" stroke-width="2.5" fill="none"/>
    <!-- Horizontal line -->
    <line x1="-14" y1="0" x2="14" y2="0" stroke="#1B365D" stroke-width="2"/>
    <!-- Vertical line -->
    <line x1="0" y1="-14" x2="0" y2="14" stroke="#1B365D" stroke-width="2"/>
    <!-- Curved latitude lines -->
    <path d="M -10,-6 Q 0,-8 10,-6" stroke="#1B365D" stroke-width="1.5" fill="none"/>
    <path d="M -10,6 Q 0,8 10,6" stroke="#1B365D" stroke-width="1.5" fill="none"/>
  </g>
  
  <!-- Gear elements around globe -->
  <g transform="translate(95, 55)" stroke="#1B365D" stroke-width="2.5" fill="none">
    <!-- Top tooth -->
    <line x1="0" y1="-24" x2="0" y2="-30"/>
    <!-- Bottom tooth -->
    <line x1="0" y1="24" x2="0" y2="30"/>
    <!-- Right tooth -->
    <line x1="24" y1="0" x2="30" y2="0"/>
    <!-- Left tooth -->
    <line x1="-24" y1="0" x2="-30" y2="0"/>
  </g>
  
  <!-- Green Accent Dot -->
  <circle cx="120" cy="28" r="7" fill="#00D4AA"/>
</svg>