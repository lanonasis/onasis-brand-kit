<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <!-- LAN ONASIS Icon: L + separator + gear/globe + green dot -->
  <!-- Transparent background -->

  <!-- Large serif L -->
  <g id="letter-L">
    <rect x="60" y="60" width="70" height="290" fill="#1B365D"/>
    <rect x="60" y="310" width="165" height="70" fill="#1B365D"/>
    <!-- Serif top -->
    <rect x="45" y="60" width="100" height="22" fill="#1B365D"/>
    <!-- Serif bottom-right -->
    <rect x="205" y="350" width="20" height="30" fill="#1B365D"/>
  </g>

  <!-- Vertical separator line -->
  <line x1="255" y1="70" x2="255" y2="390" stroke="#1B365D" stroke-width="8" stroke-linecap="round"/>

  <!-- Gear + Globe composite icon -->
  <g id="gear-globe" transform="translate(370, 220)">

    <!-- Gear body (8-tooth gear) -->
    <path d="
      M 0,-95
      L 18,-88 L 35,-105 L 55,-95
      L 62,-75 L 85,-70 L 88,-48
      L 72,-32 L 80,-10 L 65,5
      L 42,0 L 30,20 L 8,20
      L -5,5 L -28,10 L -45,-8
      L -38,-30 L -55,-48
      L -52,-70 L -30,-78
      L -22,-98 Z
    " fill="#1B365D"/>

    <!-- Globe circle (white, inside gear) -->
    <circle cx="0" cy="-35" r="52" fill="white"/>

    <!-- Globe grid lines -->
    <g stroke="#1B365D" stroke-width="2.5" fill="none">
      <!-- Outer circle -->
      <circle cx="0" cy="-35" r="52"/>
      <!-- Vertical meridian -->
      <line x1="0" y1="-87" x2="0" y2="17"/>
      <!-- Horizontal equator -->
      <line x1="-52" y1="-35" x2="52" y2="-35"/>
      <!-- Upper latitude -->
      <path d="M -44,-55 Q 0,-62 44,-55"/>
      <!-- Lower latitude -->
      <path d="M -44,-15 Q 0,-8 44,-15"/>
      <!-- Tropic of Capricorn-ish -->
      <path d="M -20,-80 Q 0,-84 20,-80"/>
      <path d="M -20,10 Q 0,14 20,10"/>
    </g>

    <!-- Connection nodes radiating from gear -->
    <g fill="#1B365D">
      <!-- Right node -->
      <circle cx="100" cy="-35" r="8"/>
      <line x1="88" y1="-35" x2="100" y2="-35" stroke="#1B365D" stroke-width="3"/>
      <!-- Top-right node -->
      <circle cx="72" cy="-112" r="8"/>
      <line x1="55" y1="-95" x2="72" y2="-112" stroke="#1B365D" stroke-width="3"/>
      <!-- Bottom-right node -->
      <circle cx="72" cy="42" r="8"/>
      <line x1="55" y1="22" x2="72" y2="42" stroke="#1B365D" stroke-width="3"/>
    </g>
  </g>

  <!-- Green accent dot -->
  <circle cx="455" cy="68" r="28" fill="#00D4AA"/>
</svg>
