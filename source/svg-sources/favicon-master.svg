<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- LAN ONASIS Favicon: simplified globe/gear on navy background -->

  <!-- Navy background -->
  <rect width="64" height="64" rx="10" ry="10" fill="#1B365D"/>

  <!-- Simplified L -->
  <rect x="8" y="8" width="10" height="36" fill="white"/>
  <rect x="8" y="39" width="22" height="10" fill="white"/>

  <!-- Gear/Globe small -->
  <g transform="translate(44, 28)">
    <!-- Gear outer -->
    <path d="M 0,-16 L 3,-14 L 6,-18 L 10,-16 L 11,-12 L 15,-11 L 15,-7 L 12,-5 L 13,-1 L 10,1 L 6,0 L 5,3 L 1,3 L -1,1 L -5,2 L -7,-1 L -6,-5 L -9,-7 L -9,-11 L -5,-12 L -4,-16 Z" fill="white"/>
    <!-- Globe -->
    <circle cx="0" cy="-6" r="8" fill="#1B365D"/>
    <g stroke="white" stroke-width="1" fill="none">
      <circle cx="0" cy="-6" r="8"/>
      <line x1="-8" y1="-6" x2="8" y2="-6"/>
      <line x1="0" y1="-14" x2="0" y2="2"/>
      <path d="M -6,-10 Q 0,-12 6,-10"/>
      <path d="M -6,-2 Q 0,0 6,-2"/>
    </g>
    <!-- Nodes -->
    <circle cx="18" cy="-6" r="2" fill="white"/>
    <line x1="15" y1="-6" x2="18" y2="-6" stroke="white" stroke-width="1.5"/>
  </g>

  <!-- Green accent dot -->
  <circle cx="53" cy="11" r="6" fill="#00D4AA"/>
</svg>
