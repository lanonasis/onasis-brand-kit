<!doctype html>
<!-- @dsCard group="Brand" name="Voice · Do & Don't" subtitle="Sentence case, no emoji, no buzzwords" viewport="700x200" --><html><head><meta charset="utf-8"><title>Voice</title>
<link rel="stylesheet" href="_card.css">
<style>
body { padding: 22px; background: #fff; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.col { padding: 14px 16px; border-radius: var(--r-md); }
.col.do { background: #E5FBF5; border-left: 3px solid #00B791; }
.col.dont { background: #FCE6E7; border-left: 3px solid #E5484D; }
.k { font: 700 11px var(--font-body); text-transform: uppercase; letter-spacing: .12em; margin-bottom: 8px; }
.k.do { color: #00785F; }
.k.dont { color: #B5292D; }
.line { font: 500 14px var(--font-body); color: var(--fg-1); margin-bottom: 6px; line-height: 1.5; }
.note { font-size: 11px; color: var(--fg-3); }
</style></head><body>
<div class="row">
  <div class="col do">
    <div class="k do">Do</div>
    <div class="line">"Deploy your first memory in under five minutes."</div>
    <div class="line">"Powering Africa's Digital Future."</div>
    <div class="note">Direct, "you", solution-focused, sentence case.</div>
  </div>
  <div class="col dont">
    <div class="k dont">Don't</div>
    <div class="line">"Leverage our synergistic AI to revolutionize 🚀"</div>
    <div class="line">"Game-changing disruption for your stack!"</div>
    <div class="note">No buzzwords, no emoji in product UI, no exclamations.</div>
  </div>
</div>
</body></html>
