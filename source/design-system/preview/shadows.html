<!doctype html>
<!-- @dsCard group="Spacing" name="Shadows" subtitle="5-step elevation, navy-tinted" viewport="700x180" --><html><head><meta charset="utf-8"><title>Shadows</title>
<link rel="stylesheet" href="_card.css">
<style>
body { background: var(--ln-grey-50); }
.row { display: flex; gap: 18px; }
.tile { background: #fff; width: 110px; height: 110px; border-radius: var(--r-lg); display: flex; align-items: flex-end; justify-content: center; padding: 10px; }
.tile span { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
</style></head><body>
<div class="row">
  <div class="tile" style="box-shadow:0 1px 2px rgba(8,18,31,.04)"><span>xs</span></div>
  <div class="tile" style="box-shadow:0 1px 3px rgba(8,18,31,.06),0 1px 2px rgba(8,18,31,.04)"><span>sm</span></div>
  <div class="tile" style="box-shadow:0 4px 12px rgba(8,18,31,.08),0 2px 4px rgba(8,18,31,.04)"><span>md</span></div>
  <div class="tile" style="box-shadow:0 12px 32px rgba(8,18,31,.10),0 4px 8px rgba(8,18,31,.05)"><span>lg</span></div>
  <div class="tile" style="box-shadow:0 24px 56px rgba(8,18,31,.14),0 8px 16px rgba(8,18,31,.06)"><span>xl</span></div>
</div>
</body></html>
