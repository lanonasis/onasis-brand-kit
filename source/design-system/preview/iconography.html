<!doctype html>
<!-- @dsCard group="Brand" name="Iconography · Lucide" subtitle="2 px stroke, navy default" viewport="700x240" --><html><head><meta charset="utf-8"><title>Iconography</title>
<link rel="stylesheet" href="_card.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
body { padding: 24px; background: #fff; }
.title { font-size: 11px; color: var(--fg-3); margin-bottom: 10px; text-transform: uppercase; letter-spacing: .12em; font-weight: 600; }
.grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; }
.cell { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 6px; border-radius: var(--r-md); border: 1px solid var(--border-subtle); }
.cell svg { width: 22px; height: 22px; stroke: var(--ln-navy); }
.cell span { font: 500 10px var(--font-mono); color: var(--fg-3); }
</style></head><body>
<div class="title">Lucide · 2 px stroke · navy by default</div>
<div class="grid">
  <div class="cell"><i data-lucide="rocket"></i><span>rocket</span></div>
  <div class="cell"><i data-lucide="shield-check"></i><span>shield</span></div>
  <div class="cell"><i data-lucide="zap"></i><span>zap</span></div>
  <div class="cell"><i data-lucide="globe"></i><span>globe</span></div>
  <div class="cell"><i data-lucide="building-2"></i><span>building</span></div>
  <div class="cell"><i data-lucide="users"></i><span>users</span></div>
  <div class="cell"><i data-lucide="trophy"></i><span>trophy</span></div>
  <div class="cell"><i data-lucide="key-round"></i><span>key</span></div>
  <div class="cell"><i data-lucide="brain"></i><span>brain</span></div>
  <div class="cell"><i data-lucide="bar-chart-3"></i><span>chart</span></div>
  <div class="cell"><i data-lucide="terminal"></i><span>terminal</span></div>
  <div class="cell"><i data-lucide="code"></i><span>code</span></div>
  <div class="cell"><i data-lucide="cloud"></i><span>cloud</span></div>
  <div class="cell"><i data-lucide="lock"></i><span>lock</span></div>
  <div class="cell"><i data-lucide="layers"></i><span>layers</span></div>
  <div class="cell"><i data-lucide="settings"></i><span>settings</span></div>
</div>
<script>lucide.createIcons();</script>
</body></html>
