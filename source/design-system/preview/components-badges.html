<!doctype html>
<!-- @dsCard group="Components" name="Badges" subtitle="Status, info, neutral, accent" viewport="700x120" --><html><head><meta charset="utf-8"><title>Badges</title>
<link rel="stylesheet" href="_card.css">
<style>
body { padding: 24px; background: #fff; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: var(--r-pill); font: 600 12px var(--font-body); }
.dot { width: 6px; height: 6px; border-radius: 999px; }
.b-success { background: #E5FBF5; color: #00785F; }
.b-info { background: #EEF2F8; color: #1B365D; }
.b-warn { background: #FFF3DB; color: #8A6D00; }
.b-danger { background: #FCE6E7; color: #B5292D; }
.b-neutral { background: var(--ln-grey-100); color: var(--ln-grey-700); }
.b-accent { background: var(--ln-navy); color: #fff; }
</style></head><body>
<div class="row">
  <span class="badge b-success"><span class="dot" style="background:#00B791"></span>Operational</span>
  <span class="badge b-info"><span class="dot" style="background:#1B365D"></span>SOC 2</span>
  <span class="badge b-warn"><span class="dot" style="background:#F5A623"></span>Pending</span>
  <span class="badge b-danger"><span class="dot" style="background:#E5484D"></span>Incident</span>
  <span class="badge b-neutral">v1.1</span>
  <span class="badge b-accent">Premium</span>
  <span class="badge b-neutral">af-west-1</span>
  <span class="badge b-success">+12.4%</span>
</div>
</body></html>
