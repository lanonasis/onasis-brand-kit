<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js" integrity="sha384-ieG+IKD0d/ZPXyCBTMVAbqsQdns8QGJR/e26WMw7M4fkaI/rHcS/YIoi+ah9WGge" crossorigin="anonymous"></script>

</head>
<body>
<div id="root"></div>
<noscript><p style="padding:24px;font-family:sans-serif">This design system site needs JavaScript.</p></noscript>
<script type="text/babel" src="site/ui.jsx"></script>
<script type="text/babel" src="site/shell.jsx"></script>
<script type="text/babel" src="site/pages-brand.jsx"></script>
<script type="text/babel" src="site/pages-foundations.jsx"></script>
<script type="text/babel" src="site/pages-build.jsx"></script>
<script type="text/babel">
const ROUTES = {
  "/": Overview, "/brand": Brand, "/colors": Colors, "/typography": Typography,
  "/foundations": Foundations, "/iconography": Iconography, "/components": Components,
  "/patterns": Patterns, "/channels": Channels, "/guidelines": Guidelines,
};
function App() {
  const route = useRoute();
  const PageC = ROUTES[route.path] || Overview;
  return <Shell route={route}><PageC route={route} /></Shell>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
