name: Monorepo Quality Gates

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

env:
  BUN_VERSION: '1.1.29'

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.changes.outputs.apps }}
      packages: ${{ steps.changes.outputs.packages }}
      services: ${{ steps.changes.outputs.services }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        run: |
          # Get list of changed apps (simplified detection)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED_APPS=$(git diff --name-only origin/${{ github.base_ref }}..HEAD | grep '^apps/' | cut -d'/' -f2 | sort -u | tr '\n' ' ')
          else
            CHANGED_APPS=$(git diff --name-only HEAD~1 HEAD | grep '^apps/' | cut -d'/' -f2 | sort -u | tr '\n' ' ')
          fi
          if [ -n "$CHANGED_APPS" ]; then
            APPS_JSON=$(echo "$CHANGED_APPS" | tr ' ' '\n' | grep -v '^$' | jq -R . | jq -s .)
          else
            APPS_JSON="[]"
          fi
          echo "apps=$APPS_JSON" >> $GITHUB_OUTPUT

          # Get list of changed packages
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED_PACKAGES=$(git diff --name-only origin/${{ github.base_ref }}..HEAD | grep '^packages/' | cut -d'/' -f2 | sort -u | tr '\n' ' ')
          else
            CHANGED_PACKAGES=$(git diff --name-only HEAD~1 HEAD | grep '^packages/' | cut -d'/' -f2 | sort -u | tr '\n' ' ')
          fi
          if [ -n "$CHANGED_PACKAGES" ]; then
            PACKAGES_JSON=$(echo "$CHANGED_PACKAGES" | tr ' ' '\n' | grep -v '^$' | jq -R . | jq -s .)
          else
            PACKAGES_JSON="[]"
          fi
          echo "packages=$PACKAGES_JSON" >> $GITHUB_OUTPUT

          # Get list of changed services
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED_SERVICES=$(git diff --name-only origin/${{ github.base_ref }}..HEAD | grep '^services/' | cut -d'/' -f2 | sort -u | tr '\n' ' ' 2>/dev/null || echo "")
          else
            CHANGED_SERVICES=$(git diff --name-only HEAD~1 HEAD | grep '^services/' | cut -d'/' -f2 | sort -u | tr '\n' ' ' 2>/dev/null || echo "")
          fi
          if [ -n "$CHANGED_SERVICES" ]; then
            SERVICES_JSON=$(echo "$CHANGED_SERVICES" | tr ' ' '\n' | grep -v '^$' | jq -R . | jq -s .)
          else
            SERVICES_JSON="[]"
          fi
          echo "services=$SERVICES_JSON" >> $GITHUB_OUTPUT

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Security scan with GitGuardian
        if: github.event_name == 'push'
        run: |
          pip install detect-secrets
          detect-secrets scan --all-files --disable-plugin AbsolutePathDetectorPlugin \
            --exclude-files '.*\.lock$|.*\.lockb$|node_modules/.*|\.git/.*' \
            --exclude-lines 'integrity.*sha'

      - name: Environment segregation check
        run: |
          # Check for service_role keys in frontend .env files
          echo "Checking for service_role keys in frontend environments..."
          if grep -r "service_role" apps/*/src/ apps/*/.env* 2>/dev/null; then
            echo "❌ Found service_role key in frontend code!"
            exit 1
          fi
          
          # Check that each app has isolated .env.example
          echo "Checking environment segregation..."
          for app in apps/*; do
            if [[ -d "$app" && ! -f "$app/.env.example" ]]; then
              echo "❌ Missing .env.example for $app"
              exit 1
            fi
          done
          echo "✅ Environment segregation check passed"

  quality-gate-apps:
    name: Quality Gate - Apps
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.apps != '[]'
    strategy:
      matrix:
        app: ${{ fromJson(needs.detect-changes.outputs.apps) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/${{ matrix.app }}/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb', 'apps/${{ matrix.app }}/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install app dependencies
        run: |
          cd apps/${{ matrix.app }}
          bun install --frozen-lockfile

      - name: Type check
        run: |
          cd apps/${{ matrix.app }}
          if [ -f "tsconfig.json" ]; then
            echo "Running TypeScript check for ${{ matrix.app }}..."
            bun run tsc --noEmit
          else
            echo "No TypeScript config found for ${{ matrix.app }}"
          fi

      - name: Lint
        run: |
          cd apps/${{ matrix.app }}
          if [ -f "eslint.config.js" ] || [ -f ".eslintrc.js" ] || [ -f ".eslintrc.json" ]; then
            echo "Running ESLint for ${{ matrix.app }}..."
            bun run lint || bun run eslint src/
          else
            echo "No ESLint config found for ${{ matrix.app }}"
          fi

      - name: Build
        run: |
          cd apps/${{ matrix.app }}
          if grep -q '"build"' package.json; then
            echo "Building ${{ matrix.app }}..."
            bun run build
          else
            echo "No build script found for ${{ matrix.app }}"
          fi

      - name: Test
        run: |
          cd apps/${{ matrix.app }}
          if grep -q '"test"' package.json; then
            echo "Running tests for ${{ matrix.app }}..."
            bun test --coverage || echo "Tests failed or no tests found"
          else
            echo "No test script found for ${{ matrix.app }}"
          fi

  quality-gate-packages:
    name: Quality Gate - Packages
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.packages != '[]'
    strategy:
      matrix:
        package: ${{ fromJson(needs.detect-changes.outputs.packages) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd packages/${{ matrix.package }}
          bun install --frozen-lockfile

      - name: Type check
        run: |
          cd packages/${{ matrix.package }}
          if [ -f "tsconfig.json" ]; then
            bun run tsc --noEmit
          fi

      - name: Lint
        run: |
          cd packages/${{ matrix.package }}
          if [ -f "eslint.config.js" ] || [ -f ".eslintrc.js" ]; then
            bun run lint || bun run eslint src/
          fi

      - name: Build
        run: |
          cd packages/${{ matrix.package }}
          if grep -q '"build"' package.json; then
            bun run build
          fi

      - name: Test
        run: |
          cd packages/${{ matrix.package }}
          if grep -q '"test"' package.json; then
            bun test
          fi

  schema-isolation-check:
    name: Schema Isolation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check schema isolation
        run: |
          echo "Checking schema isolation compliance..."
          
          # Check for cross-schema references in SQL files
          echo "Scanning SQL files for cross-schema access..."
          if find . -name "*.sql" -exec grep -l "FROM public\." {} \; | grep -v "CREATE SCHEMA\|GRANT\|REVOKE"; then
            echo "⚠️ Found potential cross-schema access. Review the files above."
          fi
          
          # Check for hardcoded project names in shared code
          echo "Checking for hardcoded project references in packages..."
          if find packages/ -name "*.ts" -o -name "*.js" | xargs grep -l "vortexcore\|maple-site\|lanonasis-maas" 2>/dev/null; then
            echo "⚠️ Found hardcoded project references in shared packages"
          fi
          
          echo "✅ Schema isolation check completed"

  deployment-readiness:
    name: Deployment Readiness
    runs-on: ubuntu-latest
    needs: [quality-gate-apps, quality-gate-packages, security-audit, schema-isolation-check]
    if: always() && (needs.quality-gate-apps.result == 'success' || needs.quality-gate-apps.result == 'skipped') && (needs.quality-gate-packages.result == 'success' || needs.quality-gate-packages.result == 'skipped') && needs.security-audit.result == 'success'
    steps:
      - name: Deployment Status
        run: |
          echo "🚀 All quality gates passed!"
          echo "✅ Security audit: ${{ needs.security-audit.result }}"
          echo "✅ Apps quality: ${{ needs.quality-gate-apps.result }}"
          echo "✅ Packages quality: ${{ needs.quality-gate-packages.result }}"
          echo "✅ Schema isolation: ${{ needs.schema-isolation-check.result }}"
          echo ""
          echo "Ready for deployment! 🎉"