name: 🌍 Internationalization Workflow

on:
  push:
    branches: [main, develop]
    paths:
      - '**/locales/en.json'
      - 'i18n.json'
      - 'scripts/auto-detect-i18n.ts'
  
  pull_request:
    branches: [main, develop]
    paths:
      - '**/locales/**'
      - 'i18n.json'
      - 'scripts/**'
  
  workflow_dispatch:
    inputs:
      force_translate:
        description: 'Force translation of all packages'
        required: false
        default: 'false'
        type: boolean
      target_languages:
        description: 'Target languages (comma-separated)'
        required: false
        default: 'es,fr,de,ja,zh,pt,ar'
        type: string

jobs:
  validate-translations:
    name: 🔍 Validate Translations
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        
      - name: 🟨 Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
          
      - name: 📦 Install dependencies
        run: bun install
        
      - name: 🔄 Auto-detect packages
        run: bun run i18n:auto-detect
        
      - name: 🔍 Validate translation structure
        run: bun run i18n:validate
        
      - name: 📊 Check coverage
        run: bun run i18n:coverage --fail-under 85
        
      - name: 🎯 Quality check
        run: bun run i18n:quality --fail-under 80
        
      - name: 📈 Generate metrics
        run: bun run i18n:metrics --format json > i18n-metrics.json
        
      - name: 📊 Upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: i18n-metrics
          path: i18n-metrics.json
          retention-days: 30

  update-translations:
    name: 🌍 Update Translations
    runs-on: ubuntu-latest
    needs: validate-translations
    if: github.ref == 'refs/heads/main' || github.event.inputs.force_translate == 'true'
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: 🟨 Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
          
      - name: 📦 Install dependencies
        run: bun install
        
      - name: 🔄 Auto-detect new packages
        run: bun run i18n:auto-detect
        
      - name: 🌍 Generate translations
        run: bun run i18n:translate
        env:
          OPENAI_API_KEY=REDACTED_OPENAI_API_KEY
          ANTHROPIC_API_KEY=REDACTED_ANTHROPIC_API_KEY
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          SUPABASE_URL=https://<project-ref>.supabase.co
          SUPABASE_SERVICE_ROLE_KEY=REDACTED_SUPABASE_SERVICE_ROLE_KEY
          
      - name: 🔍 Validate generated translations
        run: bun run i18n:validate
        
      - name: 🎯 Quality check on new translations
        run: bun run i18n:quality
        
      - name: 📊 Generate final coverage report
        run: bun run i18n:coverage
        
      - name: 📝 Commit translation updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          if git diff --staged --quiet; then
            echo "No translation changes to commit"
          else
            git commit -m "🌍 Update translations

            - Auto-generated translations for all target languages
            - Updated by GitHub Actions workflow
            - Covers: $(git diff --name-only HEAD~1 | grep 'locales/' | wc -l) translation files
            
            🤖 Generated with [Claude Code](https://claude.ai/code)
            
            Co-Authored-By: Claude <noreply@anthropic.com>"
            git push
          fi

  notify-teams:
    name: 📢 Notify Teams
    runs-on: ubuntu-latest
    needs: [validate-translations, update-translations]
    if: always() && (needs.validate-translations.result != 'success' || needs.update-translations.result == 'failure')
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        
      - name: 🟨 Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
          
      - name: 📦 Install dependencies
        run: bun install
        
      - name: 📊 Generate issue report
        run: bun run i18n:quality --verbose --format json > quality-report.json
        
      - name: 📢 Send Slack notification
        if: env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{
              "text": "🚨 i18n Translation Workflow Issues",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Translation workflow encountered issues*\n\nRepository: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}\n\nPlease check the workflow logs for details."
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Workflow"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }' \
            ${{ secrets.SLACK_WEBHOOK_URL }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  pr-comment:
    name: 💬 PR Comment
    runs-on: ubuntu-latest
    needs: validate-translations
    if: github.event_name == 'pull_request'
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        
      - name: 🟨 Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
          
      - name: 📦 Install dependencies
        run: bun install
        
      - name: 📊 Generate PR report
        run: |
          echo "## 🌍 Translation Analysis" > pr-comment.md
          echo "" >> pr-comment.md
          echo "### 📊 Coverage Report" >> pr-comment.md
          echo '```' >> pr-comment.md
          bun run i18n:coverage --format summary >> pr-comment.md
          echo '```' >> pr-comment.md
          echo "" >> pr-comment.md
          echo "### 🎯 Quality Check" >> pr-comment.md
          echo '```' >> pr-comment.md
          bun run i18n:quality --format json | jq -r '"Overall Score: " + (.overallScore | tostring) + "%\nIssues: " + (.totalIssues | tostring) + "\nErrors: " + (.summary.errors | tostring) + " | Warnings: " + (.summary.warnings | tostring)' >> pr-comment.md
          echo '```' >> pr-comment.md
          echo "" >> pr-comment.md
          echo "### 🚀 Next Steps" >> pr-comment.md
          echo "- [ ] Run \`bun run i18n:translate\` to update translations" >> pr-comment.md
          echo "- [ ] Validate with \`bun run i18n:validate\`" >> pr-comment.md
          echo "- [ ] Check quality with \`bun run i18n:quality\`" >> pr-comment.md
          echo "" >> pr-comment.md
          echo "_Generated by GitHub Actions 🤖_" >> pr-comment.md
        
      - name: 💬 Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const comment = fs.readFileSync('pr-comment.md', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # Security and monitoring job
  security-check:
    name: 🔒 Security Check
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        
      - name: 🔍 Check for secrets in translation files
        run: |
          echo "🔍 Scanning translation files for potential secrets..."
          
          # Check for API keys, tokens, passwords
          if grep -r -i -E "(api[_-]?key|token|password|secret|private|credential)" packages/*/locales/ apps/*/locales/ || true; then
            echo "⚠️ Found potential secrets in translation files!"
            echo "Please review the above matches and ensure no sensitive data is committed."
            # Don't fail the build, just warn
          else
            echo "✅ No secrets detected in translation files"
          fi
          
      - name: 🔍 Validate i18n configuration
        run: |
          echo "🔍 Validating i18n.json configuration..."
          
          # Check for hardcoded sensitive values
          if grep -i -E "(api[_-]?key|token|password|secret)" i18n.json; then
            echo "❌ Found hardcoded secrets in i18n.json!"
            exit 1
          else
            echo "✅ i18n.json configuration is clean"
          fi