name: Sync Monorepo to Standalone Repositories

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  sync-repositories:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    
    steps:
    - name: Checkout monorepo
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Configure Git
      run: |
        git config --global user.name "Monorepo Sync Bot"
        git config --global user.email "noreply@lanonasis.com"

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install

    - name: Run synchronization script
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: ./sync-repositories.sh

    - name: Notify on failure
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: 'Repository Synchronization Failed',
            body: `
            ⚠️ **Repository synchronization failed**
            
            **Workflow:** ${context.workflow}
            **Run ID:** ${context.runId}
            **Commit:** ${context.sha}
            
            Please check the workflow logs and resolve any conflicts manually.
            
            🤖 Generated with [Claude Code](https://claude.ai/code)
            `,
            labels: ['bug', 'sync-failure']
          })