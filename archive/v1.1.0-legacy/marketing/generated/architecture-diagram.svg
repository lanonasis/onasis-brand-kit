<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <radialGradient id="archBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1a2d4a"/>
      <stop offset="100%" stop-color="#0B1D33"/>
    </radialGradient>
    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lineGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowMint" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0,0 L 10,5 L 0,10 L 3,5 Z" fill="#00D4AA" opacity="0.8"/>
    </marker>
    <pattern id="archGrid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#1B365D" stroke-width="0.4" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#archBg)"/>
  <rect width="1600" height="900" fill="url(#archGrid)"/>

  <!-- Title -->
  <text x="800" y="70"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="28"
    font-weight="700"
    letter-spacing="6"
    fill="white"
    opacity="0.9">LANONASIS MEMORY PIPELINE</text>
  <text x="800" y="100"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="14"
    font-weight="300"
    letter-spacing="4"
    fill="#00D4AA"
    opacity="0.7">MEMORY · INFERENCE · CONCLUSIONS · PROFILES · CONTEXT</text>
  <line x1="500" y1="115" x2="1100" y2="115" stroke="#00D4AA" stroke-width="0.5" opacity="0.3"/>

  <!-- STAGE NODES -->
  <!-- Stage 1: Memory Store -->
  <g transform="translate(130, 450)">
    <rect x="-80" y="-60" width="160" height="120" rx="10"
      fill="#0B1D33" stroke="#00D4AA" stroke-width="1.5" opacity="0.9"/>
    <!-- Icon: stacked layers -->
    <g opacity="0.85">
      <rect x="-45" y="-40" width="90" height="18" rx="3" fill="none" stroke="white" stroke-width="1.5"/>
      <rect x="-45" y="-18" width="90" height="18" rx="3" fill="none" stroke="white" stroke-width="1.5"/>
      <rect x="-45" y="4" width="90" height="18" rx="3" fill="none" stroke="#00D4AA" stroke-width="1.5"/>
    </g>
    <text x="0" y="52"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="18" font-weight="600" letter-spacing="2"
      fill="white">MEMORIES</text>
    <!-- Glow dot -->
    <circle cx="70" cy="-50" r="6" fill="#00D4AA" filter="url(#nodeGlow)"/>
    <!-- Stage number -->
    <text x="-70" y="-45" font-family="Arial, sans-serif" font-size="11" fill="#00D4AA" opacity="0.5">01</text>
  </g>

  <!-- Stage 2: Inference Queue -->
  <g transform="translate(430, 450)">
    <rect x="-80" y="-60" width="160" height="120" rx="10"
      fill="#0B1D33" stroke="#00D4AA" stroke-width="1.5" opacity="0.9"/>
    <!-- Icon: gear with lightning -->
    <g transform="translate(0, -10)">
      <circle r="30" fill="none" stroke="white" stroke-width="1.5" opacity="0.8"/>
      <g fill="none" stroke="white" stroke-width="1.2" opacity="0.7">
        <rect x="-35" y="-6" width="12" height="12" rx="1.5" transform="rotate(0)"/>
        <rect x="-35" y="-6" width="12" height="12" rx="1.5" transform="rotate(45, -29, 0)"/>
        <rect x="-35" y="-6" width="12" height="12" rx="1.5" transform="rotate(90, -29, 0)"/>
        <rect x="-35" y="-6" width="12" height="12" rx="1.5" transform="rotate(135, -29, 0)"/>
        <rect x="-35" y="-6" width="12" height="12" rx="1.5" transform="rotate(180, -29, 0)"/>
        <rect x="-35" y="-6" width="12" height="12" rx="1.5" transform="rotate(225, -29, 0)"/>
        <rect x="-35" y="-6" width="12" height="12" rx="1.5" transform="rotate(270, -29, 0)"/>
        <rect x="-35" y="-6" width="12" height="12" rx="1.5" transform="rotate(315, -29, 0)"/>
        <circle r="20" fill="none" stroke-width="1"/>
      </g>
      <!-- Lightning bolt -->
      <path d="M 5,-12 L -2,2 L 6,0 L -1,14"
        fill="#00D4AA" stroke="#00D4AA" stroke-width="0.5" opacity="0.9"/>
    </g>
    <text x="0" y="52"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="18" font-weight="600" letter-spacing="2"
      fill="white">INFERENCE</text>
    <text x="0" y="68"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="12" font-weight="300" letter-spacing="1"
      fill="#00D4AA" opacity="0.7">QUEUE</text>
    <circle cx="70" cy="-50" r="6" fill="#00D4AA" filter="url(#nodeGlow)"/>
    <text x="-70" y="-45" font-family="Arial, sans-serif" font-size="11" fill="#00D4AA" opacity="0.5">02</text>
  </g>

  <!-- Stage 3: Conclusions -->
  <g transform="translate(730, 450)">
    <rect x="-80" y="-60" width="160" height="120" rx="10"
      fill="#0B1D33" stroke="#00D4AA" stroke-width="1.5" opacity="0.9"/>
    <!-- Icon: checkmark nodes -->
    <g transform="translate(0, -10)">
      <circle r="30" fill="none" stroke="white" stroke-width="1" opacity="0.3"/>
      <circle r="18" fill="none" stroke="white" stroke-width="0.8" opacity="0.5"/>
      <!-- Checkmark -->
      <path d="M -14,0 L -4,10 L 16,-12"
        fill="none" stroke="#00D4AA" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"
        filter="url(#lineGlow)"/>
      <!-- Small nodes -->
      <circle cx="-20" cy="-20" r="4" fill="#00D4AA" opacity="0.7"/>
      <circle cx="20" cy="-18" r="3" fill="white" opacity="0.5"/>
      <circle cx="22" cy="18" r="3" fill="white" opacity="0.4"/>
    </g>
    <text x="0" y="52"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="18" font-weight="600" letter-spacing="2"
      fill="white">CONCLUSIONS</text>
    <circle cx="70" cy="-50" r="6" fill="#00D4AA" filter="url(#nodeGlow)"/>
    <text x="-70" y="-45" font-family="Arial, sans-serif" font-size="11" fill="#00D4AA" opacity="0.5">03</text>
  </g>

  <!-- Stage 4: Profile -->
  <g transform="translate(1030, 450)">
    <rect x="-80" y="-60" width="160" height="120" rx="10"
      fill="#0B1D33" stroke="#FFD700" stroke-width="1.5" opacity="0.9"/>
    <!-- Icon: user silhouette with layers -->
    <g transform="translate(0, -10)">
      <!-- User head -->
      <circle cy="-15" r="14" fill="none" stroke="white" stroke-width="1.5" opacity="0.8"/>
      <!-- User body arc -->
      <path d="M -22,20 Q -22,4 0,4 Q 22,4 22,20"
        fill="none" stroke="white" stroke-width="1.5" opacity="0.8"/>
      <!-- Layer lines to right -->
      <line x1="18" y1="-18" x2="30" y2="-18" stroke="#FFD700" stroke-width="1" opacity="0.5"/>
      <line x1="18" y1="-6" x2="30" y2="-6" stroke="#FFD700" stroke-width="1" opacity="0.6"/>
      <line x1="18" y1="6" x2="30" y2="6" stroke="#FFD700" stroke-width="1" opacity="0.7"/>
    </g>
    <text x="0" y="52"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="18" font-weight="600" letter-spacing="2"
      fill="white">PROFILE</text>
    <circle cx="70" cy="-50" r="6" fill="#FFD700" filter="url(#nodeGlow)"/>
    <text x="-70" y="-45" font-family="Arial, sans-serif" font-size="11" fill="#FFD700" opacity="0.5">04</text>
  </g>

  <!-- Stage 5: Context -->
  <g transform="translate(1330, 450)">
    <rect x="-80" y="-60" width="160" height="120" rx="10"
      fill="#0B1D33" stroke="#FFD700" stroke-width="1.5" opacity="0.9"/>
    <!-- Icon: speech bubble with lightning -->
    <g transform="translate(0, -10)">
      <path d="M -25,-22 L 25,-22 L 25,10 L 8,10 L 0,22 L -8,10 L -25,10 Z"
        fill="none" stroke="#FFD700" stroke-width="1.5" opacity="0.85"/>
      <!-- Lines inside bubble -->
      <line x1="-15" y1="-10" x2="15" y2="-10" stroke="#FFD700" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
      <line x1="-15" y1="0" x2="5" y2="0" stroke="#FFD700" stroke-width="1.2" opacity="0.5" stroke-linecap="round"/>
    </g>
    <text x="0" y="52"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="18" font-weight="600" letter-spacing="2"
      fill="#FFD700">CONTEXT</text>
    <circle cx="70" cy="-50" r="6" fill="#FFD700" filter="url(#nodeGlow)"/>
    <text x="-70" y="-45" font-family="Arial, sans-serif" font-size="11" fill="#FFD700" opacity="0.5">05</text>
  </g>

  <!-- CONNECTOR ARROWS -->
  <!-- Arrow 1→2 -->
  <line x1="210" y1="450" x2="340" y2="450"
    stroke="#00D4AA" stroke-width="1.5" opacity="0.6" marker-end="url(#arrowMint)"/>
  <line x1="210" y1="440" x2="340" y2="440"
    stroke="#00D4AA" stroke-width="0.8" opacity="0.3"/>

  <!-- Arrow 2→3 -->
  <line x1="510" y1="450" x2="640" y2="450"
    stroke="#00D4AA" stroke-width="1.5" opacity="0.6" marker-end="url(#arrowMint)"/>
  <line x1="510" y1="440" x2="640" y2="440"
    stroke="#00D4AA" stroke-width="0.8" opacity="0.3"/>

  <!-- Arrow 3→4 -->
  <line x1="810" y1="450" x2="940" y2="450"
    stroke="#00D4AA" stroke-width="1.5" opacity="0.6" marker-end="url(#arrowMint)"/>
  <line x1="810" y1="440" x2="940" y2="440"
    stroke="#00D4AA" stroke-width="0.8" opacity="0.3"/>

  <!-- Arrow 4→5 -->
  <line x1="1110" y1="450" x2="1240" y2="450"
    stroke="#FFD700" stroke-width="1.5" opacity="0.7" marker-end="url(#arrowMint)"/>
  <line x1="1110" y1="440" x2="1240" y2="440"
    stroke="#FFD700" stroke-width="0.8" opacity="0.3"/>

  <!-- TOP SECTION: External Inputs -->
  <g transform="translate(800, 200)">
    <text x="0" y="0"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="13" font-weight="600" letter-spacing="4"
      fill="#00D4AA" opacity="0.6">EXTERNAL INPUTS</text>

    <!-- Memory writes arrow down -->
    <g transform="translate(-200, 40)">
      <rect x="-55" y="-18" width="110" height="36" rx="5"
        fill="none" stroke="#00D4AA" stroke-width="0.8" opacity="0.4"/>
      <text x="0" y="6"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12" letter-spacing="1"
        fill="white" opacity="0.6">memory.create</text>
      <line x1="0" y1="18" x2="0" y2="50" stroke="#00D4AA" stroke-width="0.8" opacity="0.3" stroke-dasharray="4,4"/>
      <polygon points="0,50 -5,44 5,44" fill="#00D4AA" opacity="0.3"/>
    </g>

    <!-- Memory updates arrow down -->
    <g transform="translate(0, 40)">
      <rect x="-55" y="-18" width="110" height="36" rx="5"
        fill="none" stroke="#00D4AA" stroke-width="0.8" opacity="0.4"/>
      <text x="0" y="6"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12" letter-spacing="1"
        fill="white" opacity="0.6">memory.update</text>
      <line x1="0" y1="18" x2="0" y2="50" stroke="#00D4AA" stroke-width="0.8" opacity="0.3" stroke-dasharray="4,4"/>
      <polygon points="0,50 -5,44 5,44" fill="#00D4AA" opacity="0.3"/>
    </g>

    <!-- Flush arrow down -->
    <g transform="translate(200, 40)">
      <rect x="-55" y="-18" width="110" height="36" rx="5"
        fill="none" stroke="#00D4AA" stroke-width="0.8" opacity="0.4"/>
      <text x="0" y="6"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12" letter-spacing="1"
        fill="white" opacity="0.6">/flush</text>
      <line x1="0" y1="18" x2="0" y2="50" stroke="#00D4AA" stroke-width="0.8" opacity="0.3" stroke-dasharray="4,4"/>
      <polygon points="0,50 -5,44 5,44" fill="#00D4AA" opacity="0.3"/>
    </g>
  </g>

  <!-- BOTTOM: Outputs -->
  <g transform="translate(800, 700)">
    <text x="0" y="0"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="13" font-weight="600" letter-spacing="4"
      fill="#FFD700" opacity="0.6">OUTPUT SURFACES</text>

    <!-- SDK arrow up -->
    <g transform="translate(-250, -40)">
      <rect x="-55" y="-18" width="110" height="36" rx="5"
        fill="none" stroke="#FFD700" stroke-width="0.8" opacity="0.4"/>
      <text x="0" y="6"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12" letter-spacing="1"
        fill="white" opacity="0.6">SDK</text>
      <line x1="0" y1="-18" x2="0" y2="-50" stroke="#FFD700" stroke-width="0.8" opacity="0.3" stroke-dasharray="4,4"/>
    </g>

    <!-- MCP arrow up -->
    <g transform="translate(-80, -40)">
      <rect x="-55" y="-18" width="110" height="36" rx="5"
        fill="none" stroke="#FFD700" stroke-width="0.8" opacity="0.4"/>
      <text x="0" y="6"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12" letter-spacing="1"
        fill="white" opacity="0.6">MCP Tools</text>
      <line x1="0" y1="-18" x2="0" y2="-50" stroke="#FFD700" stroke-width="0.8" opacity="0.3" stroke-dasharray="4,4"/>
    </g>

    <!-- CLI arrow up -->
    <g transform="translate(80, -40)">
      <rect x="-55" y="-18" width="110" height="36" rx="5"
        fill="none" stroke="#FFD700" stroke-width="0.8" opacity="0.4"/>
      <text x="0" y="6"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12" letter-spacing="1"
        fill="white" opacity="0.6">CLI</text>
      <line x1="0" y1="-18" x2="0" y2="-50" stroke="#FFD700" stroke-width="0.8" opacity="0.3" stroke-dasharray="4,4"/>
    </g>

    <!-- Hermes hook up -->
    <g transform="translate(250, -40)">
      <rect x="-55" y="-18" width="110" height="36" rx="5"
        fill="none" stroke="#FFD700" stroke-width="0.8" opacity="0.4"/>
      <text x="0" y="6"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12" letter-spacing="1"
        fill="white" opacity="0.6">Hermes Hooks</text>
      <line x1="0" y1="-18" x2="0" y2="-50" stroke="#FFD700" stroke-width="0.8" opacity="0.3" stroke-dasharray="4,4"/>
    </g>
  </g>

  <!-- Corner frame marks -->
  <g stroke="#00D4AA" stroke-width="1.5" opacity="0.3" fill="none">
    <path d="M 40,80 L 40,40 L 80,40"/>
    <path d="M 1560,80 L 1560,40 L 1520,40"/>
    <path d="M 40,820 L 40,860 L 80,860"/>
    <path d="M 1560,820 L 1560,860 L 1520,860"/>
  </g>

  <!-- Serif L watermark -->
  <text x="1550" y="880"
    text-anchor="end"
    font-family="Times New Roman, Georgia, serif"
    font-size="80"
    font-weight="bold"
    fill="white"
    opacity="0.04">L</text>
</svg>