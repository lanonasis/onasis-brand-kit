<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAN Onasis 24x24 SVG Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .test-container {
            margin: 10px 0;
            padding: 10px;
            display: flex;
            align-items: center;
        }
        .bg-light {
            background-color: #ffffff;
            border: 1px solid #ccc;
        }
        .bg-dark {
            background-color: #000000;
            border: 1px solid #333;
            color: white;
        }
        .bg-gray {
            background-color: #f0f0f0;
            border: 1px solid #ccc;
        }
        .bg-color {
            background-color: #00D4AA;
            border: 1px solid #ccc;
        }
        .test-label {
            margin-right: 15px;
            min-width: 100px;
        }
        .svg-container {
            width: 30px;
            height: 30px;
        }
    </style>
</head>
<body>
    <h1>LAN Onasis 24x24 SVG Icon Test</h1>
    
    <div class="test-container bg-light">
        <div class="test-label">Light Background</div>
        <div class="svg-container">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- LAN Onasis 24x24 Monogram SVG -->
                <!-- Based on brand guidelines -->

                <!-- Background circle in navy -->
                <circle cx="12" cy="12" r="12" fill="#1B365D"/>
                
                <!-- White inner circle -->
                <circle cx="12" cy="12" r="9" fill="white"/>
                
                <!-- The 'LAN' monogram - stylized L and A -->
                <!-- Letter L in navy -->
                <path d="M8 7H10V15H15V17H8V7Z" fill="#1B365D"/>
                
                <!-- Accent circle in gold -->
                <circle cx="17" cy="7" r="1.5" fill="#FFD700"/>
                
                <!-- Accent circle in green -->
                <circle cx="17" cy="17" r="1.5" fill="#00D4AA"/>
            </svg>
        </div>
    </div>
