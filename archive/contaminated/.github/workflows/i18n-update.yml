name: Update Translations

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/**/locales/en.json'
      - 'packages/shared/locales/en.json'
      - 'i18n.json'
  
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/**/locales/en.json'
      - 'packages/shared/locales/en.json'
      - 'i18n.json'

  workflow_dispatch:

jobs:
  update-translations:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Check translation changes
        id: check-changes
        run: |
          # Check if there are any changes to English locale files
          if git diff --quiet HEAD~1 HEAD -- "**/locales/en.json" "i18n.json"; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Update translations
        if: steps.check-changes.outputs.changes == 'true'
        env:
          OPENAI_API_KEY=REDACTED_OPENAI_API_KEY
          # Alternative: ANTHROPIC_API_KEY=REDACTED_ANTHROPIC_API_KEY
        run: |
          echo "Updating translations..."
          bun run i18n

      - name: Commit updated translations
        if: steps.check-changes.outputs.changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Add all locale files
          git add "**/locales/*.json"
          
          # Check if there are changes to commit
          if git diff --cached --quiet; then
            echo "No translation updates to commit"
          else
            git commit -m "🌍 Auto-update translations [skip ci]"
            git push
          fi

      - name: Create PR comment (if PR)
        if: github.event_name == 'pull_request' && steps.check-changes.outputs.changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🌍 **Translation Update**\n\nTranslations have been automatically updated based on changes to English locale files.\n\n**Languages updated:** Spanish, French, German, Japanese, Chinese, Portuguese, Arabic'
            })